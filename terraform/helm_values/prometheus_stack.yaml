# Values: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-70.1.1/charts/kube-prometheus-stack/values.yaml

## Install Prometheus Operator CRDs
##
crds:
  enabled: true

## Create default rules for monitoring the cluster
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

## Deploy a Prometheus instance
prometheus:
  enabled: true
  ingress:
    # TODO: Configure 'internal' nginx ingress controller
    enabled: false
    annotations:
      external-dns.alpha.kubernetes.io/hostname: ${harbor_prometheus_endpoint}
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    ingressClassName: nginx-internal
    hosts:
      - ${harbor_prometheus_endpoint}
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    externalLabels:
      cluster: ${cluster_name}

## Using default values from https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
grafana:
  enabled: true
  ingress:
    # TODO: Configure 'internal' nginx ingress controller
    enabled: false
    annotations:
      external-dns.alpha.kubernetes.io/hostname: ${harbor_grafana_endpoint}
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    ingressClassName: nginx-internal
    hosts:
      - ${harbor_grafana_endpoint}
    path: /

## Deploy node exporter as a daemonset to all nodes
nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true

## Configuration for prometheus-node-exporter subchart
prometheus-node-exporter:
  namespaceOverride: ""
  podLabels:
    ## Add the 'node-exporter' label to be used by serviceMonitor to match standard common usage in rules and grafana dashboards
    jobLabel: node-exporter
  releaseLabel: true
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
