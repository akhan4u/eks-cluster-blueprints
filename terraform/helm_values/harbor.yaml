# Values: https://github.com/goharbor/harbor-helm/blob/v1.16.2/values.yaml
expose:
  type: ingress
  tls:
    enabled: true
    certSource: auto
    secret:
      secretName: "harbor-ingress-cert"
  ingress:
    hosts:
      core: ${domain_name}
    controller: ${ingress_controller}
    className: ${ingress_class}
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"
      ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      # Values: https://kubernetes-sigs.github.io/external-dns/latest/docs/annotations/annotations/#external-dnsalphakubernetesiohostname
      external-dns.alpha.kubernetes.io/hostname: ${domain_name}
      # Values: https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.12/guide/ingress/annotations/#annotations
      alb.ingress.kubernetes.io/certificate-arn: ${harbor_acm_certificate_arn}
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: '443'
      alb.ingress.kubernetes.io/tags: CreatedWith=helm,terraform_gitpath=${terraform_gitpath}
externalURL: https://${domain_name}
harborAdminPassword: ${harbor_ui_password}
persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    redis:
      storageClass: "gp3"
      accessMode: ReadWriteOnce
      size: 1Gi
    trivy:
      storageClass: "gp3"
      accessMode: ReadWriteOnce
      size: 5Gi
  imageChartStorage:
    disableredirect: false
    type: s3
    s3:
      # Set an existing secret for S3 accesskey and secretkey
      # keys in the secret should be REGISTRY_STORAGE_S3_ACCESSKEY and REGISTRY_STORAGE_S3_SECRETKEY for registry
      existingSecret: ${s3_secret_name}
      region: ${aws_region}
      bucket: ${s3_bucket_name}
database:
  type: external
  external:
    host: ${db_host}
    port: ${db_port}
    username: ${db_instance_username}
    # 'registry' database with UTF8 encoding must already exist
    coreDatabase: ${database_name}
    # if using existing secret, the key must be "password"
    existingSecret: ${rds_secret_name}
    sslmode: "require"
metrics:
  enabled: true
  # Create prometheus serviceMonitor to scrape harbor metrics
  # This requires the monitoring.coreos.com/v1 CRD
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
jobservice:
  jobLoggers:
    - database
